CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# xiao_ble has a battery voltage divider (zmk,battery = &vbatt) but this
# is off by default - without it the halves never measure/report their own
# battery level, so the dongle has nothing to fetch regardless of its own
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING setting.
CONFIG_ZMK_BATTERY_REPORTING=y

# --- ESB split transport (github.com/badjeff/zmk-feature-split-esb) ---
# This file applies to both halves AND the dongle (ZMK matches all three on
# the "forager" prefix), so only settings common to every device go here.
# Role-specific ones: peripheral IDs in build.yaml, dongle-only ones in
# forager_central_dongle.conf. ESB on ZMK 0.4 cannot coexist with BLE, so
# the dongle is USB-only towards the host.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
# Required by the module (see its README / Kconfig help)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ESB_TX_FIFO_SIZE=1
# 96 rather than the module's usual 48: sealing adds 29 bytes to each packet
CONFIG_ESB_MAX_PAYLOAD_LENGTH=96

# Encrypt + authenticate the link (ChaCha20-Poly1305, replay protection).
# The key is NOT in this repo or in the firmware CI builds: it is flashed
# once per device from a local file, see tools/esb_key.py. A device without
# a key behaves as if this were off; a device with one only talks sealed.
CONFIG_ZMK_SPLIT_ESB_CRYPTO=y
# Battery level changes are sent (and now sealed) from ZMK's low priority
# work queue, whose default 768-byte stack is too small for that.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# One fixed RF channel instead of the module's 4-channel hop list. The
# dongle cannot actually change channel while listening (the ESB library
# refuses it), so it always sits on the first channel of the list - hopping
# only made the halves burn 3 of every 4 retries on channels nobody listens
# on. 77 = 2477 MHz, above Wi-Fi channels 1/6/11 and between Zigbee 25/26.
# If your Wi-Fi uses channel 12/13, try 25 or 50 instead (2 to 80; the same
# value must be flashed on all devices).
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_COUNT=1
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_MIN=77

# Queue sizes: the defaults (128/128/32) are sized for pointing devices and
# cost the dongle ~40 KB of RAM. A keyboard never has this many events
# waiting.
CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=32
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=32
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=8

# ZMK only turns on persistent settings (flash storage) together with BLE
# (ZMK_BLE implies SETTINGS), so with BLE off nothing would be saved -
# e.g. the dongle's ext_power state would reset on every boot.
CONFIG_SETTINGS=y
