CONFIG_PINCTRL=y
CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# ESB central (USB-only dongle; BLE is disabled in config/forager.conf, so the
# former BLE profile/bonding/BAS settings no longer apply and were removed).
# Peripheral IDs are 0 (left) and 1 (right), see build.yaml - the module
# patches ZMK's split central peripheral count to this value at build time.
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
# Number of keys in the keymap, used to heal lost key-release packets
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=34

# Despite the BLE names these are (re)defined by the ESB module when
# CONFIG_ZMK_SPLIT_BLE=n and drive peripheral battery reporting.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Mouse emulation, for the scroll combos on NAV (&msc). Only the dongle
# talks HID to the host, so the halves do not need it.
CONFIG_ZMK_POINTING=y
