parse_config:
  # NOTE: this replaces the tool's built-in punctuation map wholesale, so the
  # defaults are repeated here verbatim before adding our own entries below.
  zmk_keycode_map:
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: "$"
    DLLR: "$"
    PERCENT: "%"
    PRCNT: "%"
    CARET: "^"
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: "("
    LPAR: "("
    RIGHT_PARENTHESIS: ")"
    RPAR: ")"
    EQUAL: "="
    PLUS: "+"
    MINUS: "-"
    UNDERSCORE: "_"
    UNDER: "_"
    SLASH: "/"
    FSLH: "/"
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH: "\\"
    BSLH: "\\"
    PIPE: "|"
    NON_US_BACKSLASH: "\\"
    PIPE2: "|"
    NON_US_BSLH: "|"
    SEMICOLON: ";"
    SEMI: ";"
    COLON: ":"
    SINGLE_QUOTE: "'"
    SQT: "'"
    APOSTROPHE: "'"
    APOS: "'"
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ","
    LESS_THAN: "<"
    LT: "<"
    PERIOD: "."
    DOT: "."
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET: "["
    LBKT: "["
    LEFT_BRACE: "{"
    LBRC: "{"
    RIGHT_BRACKET: "]"
    RBKT: "]"
    RIGHT_BRACE: "}"
    RBRC: "}"
    GRAVE: "`"
    TILDE: "~"
    NON_US_HASH: "#"
    NUHS: "#"
    TILDE2: "~"

    # --- symbols added on top of the defaults above ---

    # letters - safe to convert everywhere: the only modifier+letter combos in
    # the keymap (LG(C)/LG(V)/LG(X)/LG(Z)/LG(LS(Z))) are already fully
    # overridden by raw_binding_map below, so none of these ever get combined
    # with a modifier glyph in the same legend field.
    A: "$$tabler:letter-a$$"
    B: "$$tabler:letter-b$$"
    C: "$$tabler:letter-c$$"
    D: "$$tabler:letter-d$$"
    E: "$$tabler:letter-e$$"
    F: "$$tabler:letter-f$$"
    G: "$$tabler:letter-g$$"
    H: "$$tabler:letter-h$$"
    I: "$$tabler:letter-i$$"
    J: "$$tabler:letter-j$$"
    K: "$$tabler:letter-k$$"
    L: "$$tabler:letter-l$$"
    M: "$$tabler:letter-m$$"
    N: "$$tabler:letter-n$$"
    O: "$$tabler:letter-o$$"
    P: "$$tabler:letter-p$$"
    Q: "$$tabler:letter-q$$"
    R: "$$tabler:letter-r$$"
    S: "$$tabler:letter-s$$"
    T: "$$tabler:letter-t$$"
    U: "$$tabler:letter-u$$"
    V: "$$tabler:letter-v$$"
    W: "$$tabler:letter-w$$"
    X: "$$tabler:letter-x$$"
    Y: "$$tabler:letter-y$$"
    Z: "$$tabler:letter-z$$"

    # modifiers - Tabler icons, safe here since these only ever appear as a
    # single bare keycode (e.g. a home-row-mod hold). Modifiers combined in
    # LC()/LS()/etc-wrapped combos go through modifier_fn_map instead (below),
    # which is left as plain unicode: keymap-drawer only supports one $$..$$
    # glyph per legend field, and mod_combiner concatenates multiple mods into
    # one field, so those can't be converted without breaking the render.
    LGUI: "$$tabler:command$$"
    RGUI: "$$tabler:command$$"
    GUI: "$$tabler:command$$"
    LALT: "$$tabler:option$$"
    RALT: "$$tabler:option$$"
    ALT: "$$tabler:option$$"
    LCTRL: "$$tabler:chevron-up$$"
    RCTRL: "$$tabler:chevron-up$$"
    CTRL: "$$tabler:chevron-up$$"
    LSHFT: "$$tabler:arrow-big-up$$"
    RSHFT: "$$tabler:arrow-big-up$$"
    SHIFT: "$$tabler:arrow-big-up$$"

    # arrows / navigation
    LEFT: "$$tabler:arrow-left$$"
    RIGHT: "$$tabler:arrow-right$$"
    UP: "$$tabler:arrow-up$$"
    DOWN: "$$tabler:arrow-down$$"
    HOME: "⇱"
    END: "⇲"
    PG_UP: "⇞"
    PG_DN: "⇟"

    # editing
    TAB: "$$tabler:arrow-bar-to-right$$"
    SPACE: "$$tabler:space$$"
    BSPC: "$$tabler:backspace$$"
    DEL: "$$tabler:eraser$$"
    RET: "$$tabler:corner-down-left$$"
    ENTER: "$$tabler:corner-down-left$$"
    ESC: "$$tabler:arrow-down-from-arc$$"

    # function keys - F1-F9 are real Tabler icons; F10-F12 don't exist in the
    # library so they're hand-built in draw_config.glyphs below, reusing the
    # exact digit paths from square-f0/f1/f2 so they match the family style.
    F1: "$$tabler:square-f1$$"
    F2: "$$tabler:square-f2$$"
    F3: "$$tabler:square-f3$$"
    F4: "$$tabler:square-f4$$"
    F5: "$$tabler:square-f5$$"
    F6: "$$tabler:square-f6$$"
    F7: "$$tabler:square-f7$$"
    F8: "$$tabler:square-f8$$"
    F9: "$$tabler:square-f9$$"
    F10: "$$square-f10$$"
    F11: "$$square-f11$$"
    F12: "$$square-f12$$"

  # symbols for modifiers wrapped in modifier functions, e.g. LC(LALT), LG(V)
  modifier_fn_map:
    left_ctrl: "⌃"
    right_ctrl: "⌃"
    left_shift: "⇧"
    right_shift: "⇧"
    left_alt: "⌥"
    right_alt: "⌥"
    left_gui: "⌘"
    right_gui: "⌘"
    keycode_combiner: "{mods}{key}"
    mod_combiner: "{mod_1}{mod_2}"
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: "⌃⌥⌘⇧"
      left_ctrl+left_alt+left_shift: "⌃⌥⇧"

  # HPR_G / HPR_H (the Hyper hold on the G/H keys) are the same 4-mod chord
  # spelled out on every key already via modifier_fn_map above; showing that
  # full combo again under G and H is redundant, so collapse it to a single
  # glyph there instead.
  raw_binding_map:
    "&hml LS(LA(LC(LGUI))) G": { t: "$$tabler:letter-g$$", h: "$$tabler:diamonds$$" }
    "&hmr RS(RA(RC(RGUI))) H": { t: "$$tabler:letter-h$$", h: "$$tabler:diamonds$$" }

    # named actions on the combo diagram: show what they do, not the raw shortcut
    "&kp LG(C)": "$$tabler:copy$$"
    "&kp LG(V)": "$$tabler:clipboard-text$$"
    "&kp LG(X)": "$$tabler:cut$$"
    "&kp LG(Z)": "$$tabler:arrow-back-up$$"
    "&kp LG(LS(Z))": "$$tabler:arrow-forward-up$$"
    "&kp LG(LS(LBKT))": "$$tabler:arrow-back$$"
    "&kp LG(LS(RBKT))": "$$tabler:arrow-forward$$"
    "&kp LC(LEFT)": "$$tabler:arrow-bar-to-left$$"
    "&kp LC(RIGHT)": "$$tabler:arrow-bar-to-right$$"
    "&kp LS(LC(LG(N4)))": "$$tabler:screenshot$$"
    "&studio_unlock": "$$tabler:lock-open$$"

    # esc/tab/ent/bspc combos also carry a modifier hold, but on the combo
    # diagram just the tap is what matters - drop the "h" field so the mod
    # doesn't render at all instead of showing a possibly-misleading glyph.
    "&mt LC(LALT) ESC": { t: "$$tabler:arrow-down-from-arc$$" }
    "&mt LS(LGUI) TAB": { t: "$$tabler:arrow-bar-to-right$$" }
    "&mt RS(RGUI) ENTER": { t: "$$tabler:corner-down-left$$" }
    "&mt RS(RALT) BSPC": { t: "$$tabler:backspace$$" }
    "&clipboard_manager": "$$tabler:clipboard$$"

  # Nudge combo boxes apart where several combos' key-positions overlap and
  # their default (centroid) placement would otherwise collide - see
  # https://github.com/caksoylar/keymap-drawer's ComboSpec align/offset ("a"/"o").
  # 2-key combos stay close to the row (small offset); the 3-key combos that
  # are supersets of them (redo, clipboard manager, screenshot) are pushed
  # further out so they land on a second, further-out line instead of on top.
  zmk_combos:
    # combo_undo: { align: bottom, offset: 0.1 }
    # combo_cut: { align: bottom, offset: 0.1 }
    # combo_copy: { align: bottom, offset: 0.1 }
    combo_paste: { align: bottom, offset: 0.1, slide: -0.3 }
    combo_redo: { align: bottom, offset: 0.6 }
    combo_clipboard_manager: { align: bottom, offset: 0.6 }
    # combo_left_screen: { align: bottom, offset: 0.1 }
    # combo_right_screen: { align: bottom, offset: 0.1 }
    combo_screenshot: { align: bottom, offset: 0.6 }

draw_config:
  footer_text: ""
  svg_extra_style: |
    text.footer { text-anchor: middle; }
    /* uniform stroke weight for every glyph (fetched Tabler icons and the
       hand-built F10/F11/F12 below) - the nested svg element is what carries
       the glyph's own stroke-width, see keymap-drawer's get_glyph_defs() */
    defs svg svg { stroke-width: 1.25 !important; }

    /* Nunito (fonts.google.com/specimen/Nunito), subsetted to A-Z/a-z/0-9
       and embedded as base64 so it renders standalone - no external request,
       which GitHub's SVG sanitizer would likely strip anyway. Falls back to
       the default sans-serif for anything outside that range (e.g. the
       unicode nav symbols not converted to Tabler icons). */
    @font-face {
      font-family: "Nunito";
      font-weight: 400;
      font-display: swap;
      unicode-range: U+30-39, U+41-5A, U+61-7A;
      src: url(data:font/woff;base64,) format("woff");
    }
    @font-face {
      font-family: "Nunito";
      font-weight: 700;
      font-display: swap;
      unicode-range: U+30-39, U+41-5A, U+61-7A;
      src: url(data:font/woff;base64,) format("woff");
    }
    svg.keymap { font-family: "Nunito", sans-serif; }

  # F10/F11/F12 don't exist in Tabler - built from the exact digit paths used
  # in the real square-f0/f1/f2 icons, repositioned via <g transform> (not
  # hand-redrawn, so the digit shapes are pixel-identical to the library).
  # Scale is (sx,1) - height is never touched, so digits stay exactly as tall
  # as the F. The whole "F + digit + digit" cluster is centered in the square,
  # which is what shifts F slightly left compared to the single-digit icons.
  glyphs:
    square-f10: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" /><g transform="translate(-1.45,0)"><path d="M8 12h2" /><path d="M10 9h-2v6" /></g><g transform="translate(-1.95,0)"><path d="M13 11l2 -2v6" /></g><g transform="translate(3.35,0) scale(0.9,1)"><path d="M13 10.5v3a1.5 1.5 0 0 0 3 0v-3a1.5 1.5 0 0 0 -3 0" /></g></svg>
    square-f11: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" /><g transform="translate(-1.25,0)"><path d="M8 12h2" /><path d="M10 9h-2v6" /></g><g transform="translate(-1.75,0)"><path d="M13 11l2 -2v6" /></g><g transform="translate(2.25,0)"><path d="M13 11l2 -2v6" /></g></svg>
    square-f12: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" /><g transform="translate(-1.45,0)"><path d="M8 12h2" /><path d="M10 9h-2v6" /></g><g transform="translate(-1.95,0)"><path d="M13 11l2 -2v6" /></g><g transform="translate(4.65,0) scale(0.8,1)"><path d="M13 9h2a1 1 0 0 1 1 1v1a1 1 0 0 1 -1 1h-1a1 1 0 0 0 -1 1v1a1 1 0 0 0 1 1h2" /></g></svg>
