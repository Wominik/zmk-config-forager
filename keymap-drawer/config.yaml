parse_config:
  # NOTE: this replaces the tool's built-in punctuation map wholesale, so the
  # defaults are repeated here verbatim before adding our own entries below.
  zmk_keycode_map:
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: "$"
    DLLR: "$"
    PERCENT: "%"
    PRCNT: "%"
    CARET: "^"
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: "("
    LPAR: "("
    RIGHT_PARENTHESIS: ")"
    RPAR: ")"
    EQUAL: "="
    PLUS: "+"
    MINUS: "-"
    UNDERSCORE: "_"
    UNDER: "_"
    SLASH: "/"
    FSLH: "/"
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH: "\\"
    BSLH: "\\"
    PIPE: "|"
    NON_US_BACKSLASH: "\\"
    PIPE2: "|"
    NON_US_BSLH: "|"
    SEMICOLON: ";"
    SEMI: ";"
    COLON: ":"
    SINGLE_QUOTE: "'"
    SQT: "'"
    APOSTROPHE: "'"
    APOS: "'"
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ","
    LESS_THAN: "<"
    LT: "<"
    PERIOD: "."
    DOT: "."
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET: "["
    LBKT: "["
    LEFT_BRACE: "{"
    LBRC: "{"
    RIGHT_BRACKET: "]"
    RBKT: "]"
    RIGHT_BRACE: "}"
    RBRC: "}"
    GRAVE: "`"
    TILDE: "~"
    NON_US_HASH: "#"
    NUHS: "#"
    TILDE2: "~"

    # --- symbols added on top of the defaults above ---

    # modifiers - Tabler icons, safe here since these only ever appear as a
    # single bare keycode (e.g. a home-row-mod hold). Modifiers combined in
    # LC()/LS()/etc-wrapped combos go through modifier_fn_map instead (below),
    # which is left as plain unicode: keymap-drawer only supports one $$..$$
    # glyph per legend field, and mod_combiner concatenates multiple mods into
    # one field, so those can't be converted without breaking the render.
    LGUI: "$$tabler:command$$"
    RGUI: "$$tabler:command$$"
    GUI: "$$tabler:command$$"
    LALT: "$$tabler:alt$$"
    RALT: "$$tabler:alt$$"
    ALT: "$$tabler:alt$$"
    LCTRL: "$$tabler:chevron-up$$"
    RCTRL: "$$tabler:chevron-up$$"
    CTRL: "$$tabler:chevron-up$$"
    LSHFT: "$$tabler:arrow-big-up$$"
    RSHFT: "$$tabler:arrow-big-up$$"
    SHIFT: "$$tabler:arrow-big-up$$"

    # arrows / navigation
    LEFT: "$$tabler:arrow-left$$"
    RIGHT: "$$tabler:arrow-right$$"
    UP: "$$tabler:arrow-up$$"
    DOWN: "$$tabler:arrow-down$$"
    HOME: "⇱"
    END: "⇲"
    PG_UP: "⇞"
    PG_DN: "⇟"

    # editing
    TAB: "$$tabler:arrow-bar-to-right$$"
    SPACE: "$$tabler:space$$"
    BSPC: "$$tabler:backspace$$"
    DEL: "$$tabler:eraser$$"
    RET: "$$tabler:corner-down-left$$"
    ENTER: "$$tabler:corner-down-left$$"
    ESC: "$$tabler:arrow-down-from-arc$$"

  # symbols for modifiers wrapped in modifier functions, e.g. LC(LALT), LG(V)
  modifier_fn_map:
    left_ctrl: "⌃"
    right_ctrl: "⌃"
    left_shift: "⇧"
    right_shift: "⇧"
    left_alt: "⌥"
    right_alt: "⌥"
    left_gui: "⌘"
    right_gui: "⌘"
    keycode_combiner: "{mods}{key}"
    mod_combiner: "{mod_1}{mod_2}"
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: "⌃⌥⌘⇧"
      left_ctrl+left_alt+left_shift: "⌃⌥⇧"

  # HPR_G / HPR_H (the Hyper hold on the G/H keys) are the same 4-mod chord
  # spelled out on every key already via modifier_fn_map above; showing that
  # full combo again under G and H is redundant, so collapse it to a single
  # glyph there instead.
  raw_binding_map:
    "&hml LS(LA(LC(LGUI))) G": { t: G, h: "$$tabler:diamonds$$" }
    "&hmr RS(RA(RC(RGUI))) H": { t: H, h: "$$tabler:diamonds$$" }

    # named actions on the combo diagram: show what they do, not the raw shortcut
    "&kp LG(C)": "$$tabler:copy$$"
    "&kp LG(V)": "$$tabler:clipboard-text$$"
    "&kp LG(X)": "$$tabler:cut$$"
    "&kp LG(Z)": "$$tabler:arrow-back-up$$"
    "&kp LG(LS(Z))": "$$tabler:arrow-forward-up$$"
    "&kp LG(LS(LBKT))": "$$tabler:arrow-back$$"
    "&kp LG(LS(RBKT))": "$$tabler:arrow-forward$$"
    "&kp LC(LEFT)": "$$tabler:arrow-bar-to-left$$"
    "&kp LC(RIGHT)": "$$tabler:arrow-bar-to-right$$"
    "&kp LS(LC(LG(N4)))": "$$tabler:screenshot$$"
    "&studio_unlock": "$$tabler:lock-open$$"
    "&clipboard_manager": "$$tabler:clipboard$$"

  # Nudge combo boxes apart where several combos' key-positions overlap and
  # their default (centroid) placement would otherwise collide - see
  # https://github.com/caksoylar/keymap-drawer's ComboSpec align/offset ("a"/"o").
  # 2-key combos stay close to the row (small offset); the 3-key combos that
  # are supersets of them (redo, clipboard manager, screenshot) are pushed
  # further out so they land on a second, further-out line instead of on top.
  zmk_combos:
    # combo_undo: { align: bottom, offset: 0.1 }
    # combo_cut: { align: bottom, offset: 0.1 }
    # combo_copy: { align: bottom, offset: 0.1 }
    combo_paste: { align: bottom, offset: 0.1, slide: -0.3 }
    combo_redo: { align: bottom, offset: 0.6 }
    combo_clipboard_manager: { align: bottom, offset: 0.6 }
    # combo_left_screen: { align: bottom, offset: 0.1 }
    # combo_right_screen: { align: bottom, offset: 0.1 }
    combo_screenshot: { align: bottom, offset: 0.6 }

draw_config:
  footer_text: ""
  svg_extra_style: |
    text.footer { text-anchor: middle; }
