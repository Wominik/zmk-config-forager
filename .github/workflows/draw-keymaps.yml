name: Draw ZMK keymaps
on:
  workflow_dispatch: # can be triggered manually
  push: # automatically run on changes to following paths
    paths:
      - "config/*.keymap"
      - "keymap-drawer/config.yaml"

# Produces two diagrams in keymap-drawer/, following the approach used by
# https://github.com/urob/zmk-config (generated there locally via `just draw`,
# reproduced here in CI so nothing needs to be installed/run locally):
#   - base.svg:     every layer drawn on its own, plus a virtual "Combos" layer
#   - overview.svg: NAV/NUM/BRAC folded into BASE as per-key corner labels
#                    (tr=NAV, br=NUM, bl=BRAC, tl=synthetic "NUM+Shift" symbol
#                    - FUN is intentionally left out of the overview but still
#                    fully shown in base.svg). A corner is dropped whenever it
#                    would just repeat the key's own tap/hold (e.g. the
#                    modifier row that's mirrored onto NAV/NUM/BRAC for
#                    consistency on A/S/D/F) - G/H (14/15) are hardcoded to
#                    show no corners at all since their Hyper hold is
#                    abbreviated to "✦" and wouldn't text-match the
#                    spelled-out chord on NAV/NUM/BRAC.

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow workflow to commit the generated files back
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install keymap-drawer, west and yq
        run: |
          pipx install keymap-drawer
          pipx install west
          pipx install yq # python-yq (jq wrapper for YAML), NOT the golang yq

      - name: Fetch west modules (needed to resolve the forager physical layout)
        run: |
          west init -l config
          west config --local manifest.project-filter " -zmk,-zephyr"
          west update --fetch-opt=--filter=tree:0

      - name: Draw base.svg (all layers + virtual Combos layer)
        run: |
          set -euo pipefail
          mkdir -p keymap-drawer
          config_path="keymap-drawer/config.yaml"
          [ -e "$config_path" ] && config_arg=(-c "$config_path") || config_arg=()

          keymap "${config_arg[@]}" parse -z config/forager.keymap --virtual-layers Combos > keymap-drawer/base.yaml
          yq -Yi '.combos.[].l = ["Combos"]' keymap-drawer/base.yaml
          keymap "${config_arg[@]}" draw keymap-drawer/base.yaml > keymap-drawer/base.svg
          # keymap-drawer places the footer at the right edge; re-center it (see config.yaml's svg_extra_style)
          sed -i -E 's/(x=")[0-9.]+(" y="[0-9.]+" class="footer")/\150%\2/' keymap-drawer/base.svg

      - name: Build overview.yaml (NAV/NUM/BRAC as corner labels on BASE)
        run: |
          set -euo pipefail
          jq_expr='
            def extract_label: if type == "string" then . else .t end;
            def is_transparent: type == "object" and (.type == "trans" or .type == "held");
            # tap (and hold, if any) text already shown in the center/bottom of the key
            def base_values: if type == "string" then [.] else ([.t] + (if has("h") then [.h] else [] end)) end;
            # what Shift+key produces on a US layout, for the synthetic "NUM+Shift" tl corner
            def shift_map: {
              "1": "!", "2": "@", "3": "#", "4": "$", "5": "%",
              "6": "^", "7": "&", "8": "*", "9": "(", "0": ")",
              "-": "_", "\\": "|"
            };

            .layers = {
              BASE: [
                [.layers.BASE, .layers.NAV, .layers.NUM, .layers.BRAC] | transpose | to_entries[] |
                .key as $pos |
                (.value[0] | if type == "string" then {t: .} else . end) as $base |
                ($base | base_values) as $base_vals |
                # G (14): NAV there is just the Hyper chord already shown as "✦" on the hold - drop it.
                # Everywhere else, only drop NAV when it is an exact repeat of the tap/hold already
                # shown (the modifier row mirrored onto NAV for consistency) - e.g. A/S/D/F stay
                # clean, but J/K/L/; still get their arrows since those are not duplicates.
                (.value[1] | if is_transparent then null else extract_label end) as $nav_label |
                (if $nav_label == null or $pos == 14 or ($base_vals | index($nav_label)) then null else $nav_label end) as $nav |
                (.value[2] | if is_transparent then null else extract_label end) as $num_label |
                # G (14): NUM there is just the Hyper chord already shown as "✦" on the hold - drop it
                (if $num_label == null or $pos == 14 or ($base_vals | index($num_label)) then null else $num_label end) as $num |
                # NUM+Shift symbol, top-left (never fires on A/S/D/F/G/H since their NUM value is a
                # modifier/chord, not a digit, so it is naturally absent there without special-casing)
                (if $num_label == null or ((shift_map | has($num_label)) | not)
                 then null else shift_map[$num_label] end) as $tl |
                # H (15): BRAC there is just the Hyper chord already shown as "✦" on the hold - drop it
                (.value[3] | if is_transparent or $pos == 15 then null else extract_label end) as $brac_raw |
                (if $brac_raw == null or ($base_vals | index($brac_raw)) then null else $brac_raw end) as $brac |
                $base
                + (if $nav  == null or $nav  == "" then {} else {tr: $nav}  end)
                + (if $num  == null or $num  == "" then {} else {br: $num}  end)
                + (if $brac == null or $brac == "" then {} else {bl: $brac} end)
                + (if $tl   == null or $tl   == "" then {} else {tl: $tl}   end)
              ],
              Combos: .layers.Combos
            } |
            .combos = [.combos[] | .l = ["Combos"]]
          '
          yq -y "$jq_expr" keymap-drawer/base.yaml > keymap-drawer/overview.yaml

      - name: Draw overview.svg
        run: |
          set -euo pipefail
          config_path="keymap-drawer/config.yaml"
          [ -e "$config_path" ] && config_arg=(-c "$config_path") || config_arg=()

          keymap "${config_arg[@]}" draw keymap-drawer/overview.yaml > keymap-drawer/overview.svg
          sed -i '/<text.*class="label"/d' keymap-drawer/overview.svg
          sed -i -E 's/(x=")[0-9.]+(" y="[0-9.]+" class="footer")/\150%\2/' keymap-drawer/overview.svg

      - name: Commit updated diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "keymap-drawer/*.svg keymap-drawer/*.yaml"
          commit_message: "keymap-drawer render"
